name: Build Dungeon Blitz Ruffle v6

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/ruffle-dungeon-blitz-*.patch'
      - 'scripts/build-ruffle-dbr.sh'
      - 'scripts/deploy-ruffle-dbr-v6.sh'
      - '.github/workflows/build-ruffle-dbr-v6.yml'

permissions:
  contents: read

jobs:
  build-selfhosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
      NODE_OPTIONS: --max-old-space-size=1536

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.120 --locked

      - name: Install wasm-opt
        uses: sigoden/install-binary@v1
        with:
          repo: WebAssembly/binaryen
          tag: version_129
          name: wasm-opt

      - name: Build patched self-hosted Ruffle bundle (with lifecycle trace)
        run: |
          DBR_RUNTIME_LABEL=v6 \
          DBR_ENABLE_LIFECYCLE_TRACE=1 \
          RUFFLE_SOURCE_DIR="${RUNNER_TEMP}/ruffle-dbr-source" \
            ./scripts/build-ruffle-dbr.sh "${RUNNER_TEMP}/ruffle-dbr-v6"

      - name: Verify bundle and lifecycle trace patch
        run: |
          test -f "${RUNNER_TEMP}/ruffle-dbr-v6/ruffle.js"
          find "${RUNNER_TEMP}/ruffle-dbr-v6" -type f -name '*.wasm' -print -quit | grep -q .
          grep -F 'Runtime: v6' "${RUNNER_TEMP}/ruffle-dbr-v6/DUNGEON_BLITZ_BUILD.txt"
          grep -F 'DBR-TRACE' "${RUNNER_TEMP}/ruffle-dbr-v6/DUNGEON_BLITZ_BUILD.txt"
          grep -F 'DBR-TRACE' patches/ruffle-dungeon-blitz-lifecycle-trace.patch

      - name: Upload Ruffle v6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruffle-dbr-v6
          path: ${{ runner.temp }}/ruffle-dbr-v6
          if-no-files-found: error
          retention-days: 14
